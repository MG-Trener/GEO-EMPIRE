name: Refine Mobile Game UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-mobile-game-ui.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Install Expo mobile modules
        working-directory: apps/mobile
        run: npx expo install expo-audio react-native-safe-area-context @react-native-async-storage/async-storage

      - name: Apply mobile refinement
        run: python3 .github/scripts/refine_mobile_game_ui.py

      - name: Verify TypeScript and API build
        run: |
          npm --workspace @geo-empire/mobile run typecheck
          npm --workspace @geo-empire/api run typecheck
          npm --workspace @geo-empire/api run build

      - name: Commit refined game UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          git commit -m "feat(mobile): compact map HUD settings sounds and resource rates"
          git push origin main

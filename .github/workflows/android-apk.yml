name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: Public or LAN URL of GEO EMPIRE API, for example https://api.example.com
        required: false
        default: https://geo-empire-api-current-production.up.railway.app
      demo_player_id:
        description: Demo player UUID used by the current prototype
        required: false
        default: 11111111-1111-4111-8111-111111111111

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://geo-empire-api-current-production.up.railway.app' }}
      EXPO_PUBLIC_DEMO_PLAYER_ID: ${{ github.event.inputs.demo_player_id || '11111111-1111-4111-8111-111111111111' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install --include=dev

      - name: Typecheck mobile
        run: npm --workspace @geo-empire/mobile run typecheck

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geo-empire-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: Add resource map overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-resource-map-overlay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add discovered resource layer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/App.tsx')
          text = path.read_text(encoding='utf-8')

          marker = "function formatNumber(value: number, maxDigits = 0): string {\n  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: maxDigits }).format(value);\n}\n"
          addition = marker + "\nfunction scanDepositsToGeoJson(scan: GeologyScanResponse | null): FeatureCollection<Polygon> {\n  const seen = new Set<string>();\n  const deposits = scan?.deposits ?? [];\n  return {\n    type: 'FeatureCollection',\n    features: deposits.flatMap((deposit) => {\n      if (!deposit.h3Index || seen.has(deposit.h3Index)) return [];\n      seen.add(deposit.h3Index);\n      const boundary = cellToBoundary(deposit.h3Index, true) as [number, number][];\n      if (!boundary.length) return [];\n      return [{\n        type: 'Feature' as const,\n        id: `deposit-${deposit.h3Index}`,\n        properties: {\n          resourceCode: deposit.resource.code,\n          resourceName: deposit.resource.name,\n          rarity: deposit.resource.rarity,\n        },\n        geometry: { type: 'Polygon' as const, coordinates: [[...boundary, boundary[0]]] },\n      }];\n    }),\n  };\n}\n"
          if marker not in text:
              raise SystemExit('formatNumber marker missing')
          text = text.replace(marker, addition, 1)

          old = "  const [showGeology, setShowGeology] = useState(false);\n  const [hubSection, setHubSection] = useState<GeoHubSection>('geology');"
          new = "  const [showGeology, setShowGeology] = useState(false);\n  const [showResourceOverlay, setShowResourceOverlay] = useState(true);\n  const [hubSection, setHubSection] = useState<GeoHubSection>('geology');"
          if old not in text:
              raise SystemExit('state marker missing')
          text = text.replace(old, new, 1)

          old = "  const depositsInSelectedCell = useMemo(\n    () => scan?.deposits.filter((deposit) => deposit.h3Index === selectedCell?.h3Index) ?? [],\n    [scan, selectedCell],\n  );"
          new = old + "\n  const discoveredDepositsGeoJson = useMemo(\n    () => showResourceOverlay ? scanDepositsToGeoJson(scan) : ({ type: 'FeatureCollection', features: [] } as FeatureCollection<Polygon>),\n    [scan, showResourceOverlay],\n  );"
          if old not in text:
              raise SystemExit('deposit memo marker missing')
          text = text.replace(old, new, 1)

          old = "      setScan(result);\n      setSheetExpanded(true);"
          new = "      setScan(result);\n      setShowResourceOverlay(true);\n      setSheetExpanded(true);"
          if old not in text:
              raise SystemExit('scan result marker missing')
          text = text.replace(old, new, 1)

          # Preserve the latest scan while exploring nearby cells.
          old = "              setSelectedCell(cell);\n              setScan(null);\n              setShowGeology(false);"
          new = "              setSelectedCell(cell);\n              setShowGeology(false);"
          if old not in text:
              raise SystemExit('cell selection marker missing')
          text = text.replace(old, new, 1)

          insertion_point = "        </GeoJSONSource>\n\n        <GeoJSONSource id=\"player-position\" data={playerGeoJson}>"
          overlay = "        </GeoJSONSource>\n\n        <GeoJSONSource id=\"discovered-resource-zones\" data={discoveredDepositsGeoJson}>\n          <Layer\n            id=\"resource-zone-fill\"\n            type=\"fill\"\n            paint={{\n              'fill-color': [\n                'match', ['get', 'resourceCode'],\n                'OIL', '#111820',\n                'GAS', '#2d9df4',\n                'GOLD', '#f4b942',\n                'COPPER', '#d76b3e',\n                'IRON', '#a7b2bd',\n                'COAL', '#343b43',\n                'URANIUM', '#65db72',\n                'RARE_EARTHS', '#9b63e8',\n                '#32d8e6',\n              ],\n              'fill-opacity': 0.5,\n            } as never}\n          />\n          <Layer\n            id=\"resource-zone-outline\"\n            type=\"line\"\n            paint={{\n              'line-color': '#f4f8fa',\n              'line-width': 2.2,\n              'line-opacity': 0.82,\n            } as never}\n          />\n        </GeoJSONSource>\n\n        <GeoJSONSource id=\"player-position\" data={playerGeoJson}>"
          if insertion_point not in text:
              raise SystemExit('map source insertion point missing')
          text = text.replace(insertion_point, overlay, 1)

          old = "          <MapToolButton\n            source={gameAssets.utility.filter}\n            accessibilityLabel=\"Фильтры ресурсов\"\n            onPress={() => setMessage('Фильтр ресурсов: нефть, газ, металлы, уголь и редкоземельные')}\n          />"
          new = "          <MapToolButton\n            source={gameAssets.utility.filter}\n            accessibilityLabel=\"Фильтры ресурсов\"\n            active={showResourceOverlay}\n            onPress={() => setShowResourceOverlay((current) => {\n              const next = !current;\n              setMessage(next ? 'Слой найденных ресурсов включён' : 'Слой найденных ресурсов скрыт');\n              return next;\n            })}\n          />"
          if old not in text:
              raise SystemExit('filter tool marker missing')
          text = text.replace(old, new, 1)

          old = "function MapToolButton({\n  source,\n  onPress,\n  accessibilityLabel,\n}: {\n  source: ImageSourcePropType;\n  onPress: () => void;\n  accessibilityLabel: string;\n}) {"
          new = "function MapToolButton({\n  source,\n  onPress,\n  accessibilityLabel,\n  active = false,\n}: {\n  source: ImageSourcePropType;\n  onPress: () => void;\n  accessibilityLabel: string;\n  active?: boolean;\n}) {"
          if old not in text:
              raise SystemExit('MapToolButton signature missing')
          text = text.replace(old, new, 1)

          old = "      style={({ pressed }) => [styles.mapToolButton, pressed && styles.pressed]}"
          new = "      style={({ pressed }) => [styles.mapToolButton, active && styles.mapToolButtonActive, pressed && styles.pressed]}"
          if old not in text:
              raise SystemExit('MapToolButton style marker missing')
          text = text.replace(old, new, 1)

          old = "  mapToolImage: { width: '100%', height: '100%' },"
          new = "  mapToolButtonActive: { borderWidth: 1, borderColor: 'rgba(56,216,255,0.85)', shadowColor: '#38d8ff', shadowOpacity: 0.5 },\n  mapToolImage: { width: '100%', height: '100%' },"
          if old not in text:
              raise SystemExit('map tool styles marker missing')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit resource overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/App.tsx
          git commit -m "feat(mobile): show discovered resource zones on map"
          git push origin main

name: Apply Client Geology Dedupe

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-client-geology-dedupe.mjs'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply geology display patch
        run: node tools/apply-client-geology-dedupe.mjs

      - name: Commit patched source and clean one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/api.ts apps/mobile/src/MainSectionPanelLegacy.tsx apps/mobile/src/KnownDepositsPanel.tsx apps/mobile/app.json
          git rm .github/workflows/apply-client-geology-dedupe.yml tools/apply-client-geology-dedupe.mjs
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "fix(mobile): dedupe nearby geology zones and release v0.2.16"
          git push

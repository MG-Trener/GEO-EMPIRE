name: Apply Mobile Geo Fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-mobile-geo-fix.mjs'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: node tools/apply-mobile-geo-fix.mjs

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/AppFirstMiningLoop.tsx apps/api/src/game/world-generation.ts apps/api/src/routes/geology-scan.ts apps/api/src/routes/geology.ts apps/api/src/routes/geology-known-deposits.ts
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "fix(mobile): preserve map zoom and reduce deposit clutter"
          git push

name: Apply mobile hotfix v0.2.10

on:
  push:
    branches:
      - fix/mobile-exploration-map-scale

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-exploration-map-scale
          fetch-depth: 0

      - name: Apply focused mobile fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1. Make industrial artwork genuinely zoom-dependent and substantially smaller.
          industrial = Path('apps/mobile/src/IndustrialMapLayer.tsx')
          text = industrial.read_text()
          pattern = re.compile(
              r"            'icon-size': \[\n              'match', \['get', 'iconKey'\],.*?            \],\n            'icon-anchor': 'bottom',",
              re.S,
          )
          replacement = """            'icon-size': [
              'interpolate', ['linear'], ['zoom'],
              10, ['match', ['get', 'iconKey'], 'industry-mine', 0.004, 'industry-pumpjack', 0.004, 0.05],
              12, ['match', ['get', 'iconKey'], 'industry-mine', 0.006, 'industry-pumpjack', 0.006, 0.075],
              14, ['match', ['get', 'iconKey'], 'industry-mine', 0.009, 'industry-pumpjack', 0.009, 0.11],
              16, ['match', ['get', 'iconKey'], 'industry-mine', 0.013, 'industry-pumpjack', 0.013, 0.16],
              18, ['match', ['get', 'iconKey'], 'industry-mine', 0.018, 'industry-pumpjack', 0.018, 0.23],
              20, ['match', ['get', 'iconKey'], 'industry-mine', 0.026, 'industry-pumpjack', 0.026, 0.32],
            ],
            'icon-anchor': 'bottom',"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Industrial icon-size block not found')
          text = text.replace(
              "['interpolate', ['linear'], ['zoom'], 10, 7, 12, 10, 14, 15, 16, 22, 18, 30, 20, 36]",
              "['interpolate', ['linear'], ['zoom'], 10, 5, 12, 7, 14, 10, 16, 14, 18, 18, 20, 24]",
              1,
          )
          text = text.replace(
              "['interpolate', ['linear'], ['zoom'], 10, 5, 12, 8, 14, 12, 16, 18, 18, 24, 20, 30]",
              "['interpolate', ['linear'], ['zoom'], 10, 4, 12, 6, 14, 8, 16, 11, 18, 15, 20, 20]",
              1,
          )
          industrial.write_text(text)

          # 2. Compact card: keep exploration accessible and harden extraction math against invalid timestamps/numbers.
          summary = Path('apps/mobile/src/StrategicCellSummary.tsx')
          text = summary.read_text()
          old_helpers = """function shortNumber(value: number): string {
  const absolute = Math.abs(value);
  if (absolute >= 1_000_000_000) return `${(value / 1_000_000_000).toFixed(1)}B`;
  if (absolute >= 1_000_000) return `${(value / 1_000_000).toFixed(1)}M`;
  if (absolute >= 1_000) return `${(value / 1_000).toFixed(1)}K`;
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 }).format(value);
}

function formatClock(seconds: number): string {
  const safe = Math.max(0, Math.ceil(seconds));
"""
          new_helpers = """function finiteNumber(value: unknown, fallback = 0): number {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
}

function shortNumber(value: number): string {
  const safeValue = finiteNumber(value);
  const absolute = Math.abs(safeValue);
  if (absolute >= 1_000_000_000) return `${(safeValue / 1_000_000_000).toFixed(1)}B`;
  if (absolute >= 1_000_000) return `${(safeValue / 1_000_000).toFixed(1)}M`;
  if (absolute >= 1_000) return `${(safeValue / 1_000).toFixed(1)}K`;
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 }).format(safeValue);
}

function formatClock(seconds: number): string {
  const safe = Math.max(0, Math.ceil(finiteNumber(seconds)));
"""
          if old_helpers not in text:
              raise SystemExit('Strategic helper block not found')
          text = text.replace(old_helpers, new_helpers, 1)

          live_pattern = re.compile(r"  const liveExtraction = useMemo\(\(\) => \{.*?\n  \}, \[extraction, now\]\);", re.S)
          live_replacement = """  const liveExtraction = useMemo(() => {
    if (!extraction) return null;

    const ratePerHour = Math.max(0, finiteNumber(extraction.ratePerHour));
    const maxBufferHours = Math.max(0, finiteNumber(extraction.maxBufferHours));
    const capacity = Math.max(0.01, ratePerHour * maxBufferHours);
    const reportedAvailable = Math.max(0, finiteNumber(extraction.availableToCollect));
    const depositRemaining = Math.max(0, finiteNumber(extraction.deposit.quantityRemaining));

    if (extraction.status !== 'running') {
      const available = Math.min(depositRemaining, capacity, reportedAvailable);
      return { available, capacity, fill: Math.max(0, Math.min(1, available / capacity)), fullInSeconds: 0 };
    }

    const collectedAtMs = Date.parse(String(extraction.lastCollectedAt ?? ''));
    const elapsedHours = Number.isFinite(collectedAtMs)
      ? Math.max(0, (now - collectedAtMs) / 3_600_000)
      : 0;
    const available = Math.min(
      depositRemaining,
      capacity,
      Math.max(reportedAvailable, ratePerHour * elapsedHours),
    );
    const fill = Math.max(0, Math.min(1, available / capacity));
    const remaining = Math.max(0, capacity - available);
    const fullInSeconds = ratePerHour > 0 ? remaining / ratePerHour * 3600 : 0;
    return { available, capacity, fill, fullInSeconds };
  }, [extraction, now]);"""
          text, count = live_pattern.subn(live_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Strategic live extraction block not found')

          old_actions = """      <View style={styles.actions}>
        <QuickAction {...primaryAction} />
        {primaryAction.onPress !== onExpand ? (
          <QuickAction
            source={gameAssets.utility.list}
            label=\"ПОДРОБНЕЕ\"
            disabled={false}
            onPress={onExpand}
          />
        ) : null}
      </View>"""
          new_actions = """      <View style={styles.actions}>
        <QuickAction {...primaryAction} />
        {!rival && primaryAction.onPress !== onScan ? (
          <QuickAction
            source={gameAssets.actions.research}
            label={scanning ? `РАЗВЕДКА · ${formatClock(scanElapsed)}` : 'РАЗВЕДКА'}
            busy={scanning}
            disabled={scanning || busy}
            onPress={onScan}
          />
        ) : null}
        {primaryAction.onPress !== onExpand ? (
          <QuickAction
            source={gameAssets.utility.list}
            label=\"ДЕТАЛИ\"
            disabled={false}
            onPress={onExpand}
          />
        ) : null}
      </View>"""
          if old_actions not in text:
              raise SystemExit('Strategic action block not found')
          text = text.replace(old_actions, new_actions, 1)
          summary.write_text(text)

          # 3. Expanded territory panel: same numeric hardening + an explicit exploration action on developed cells.
          panel = Path('apps/mobile/src/FirstMiningTerritoryPanel.tsx')
          text = panel.read_text()
          old_format = """function formatNumber(value: number, maxDigits = 0): string {
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: maxDigits }).format(value);
}

function formatClock(seconds: number): string {
  const safe = Math.max(0, Math.ceil(seconds));
"""
          new_format = """function finiteNumber(value: unknown, fallback = 0): number {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
}

function formatNumber(value: number, maxDigits = 0): string {
  return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: maxDigits }).format(finiteNumber(value));
}

function formatClock(seconds: number): string {
  const safe = Math.max(0, Math.ceil(finiteNumber(seconds)));
"""
          if old_format not in text:
              raise SystemExit('Territory helper block not found')
          text = text.replace(old_format, new_format, 1)

          panel_live_pattern = re.compile(r"  const liveExtraction = useMemo\(\(\) => \{.*?\n  \}, \[extraction, now\]\);", re.S)
          panel_live_replacement = """  const liveExtraction = useMemo(() => {
    if (!extraction) return null;
    const ratePerHour = Math.max(0, finiteNumber(extraction.ratePerHour));
    const maxBufferHours = Math.max(0, finiteNumber(extraction.maxBufferHours));
    const capacity = Math.max(0.01, ratePerHour * maxBufferHours);
    const reportedAvailable = Math.max(0, finiteNumber(extraction.availableToCollect));
    const depositRemaining = Math.max(0, finiteNumber(extraction.deposit.quantityRemaining));

    if (extraction.status !== 'running') {
      const available = Math.min(depositRemaining, capacity, reportedAvailable);
      return { available, capacity, fill: Math.max(0, Math.min(1, available / capacity)), fullInSeconds: 0 };
    }

    const collectedAtMs = Date.parse(String(extraction.lastCollectedAt ?? ''));
    const elapsedHours = Number.isFinite(collectedAtMs)
      ? Math.max(0, (now - collectedAtMs) / 3_600_000)
      : 0;
    const available = Math.min(
      depositRemaining,
      capacity,
      Math.max(reportedAvailable, ratePerHour * elapsedHours),
    );
    const fill = Math.max(0, Math.min(1, available / capacity));
    const fullInSeconds = ratePerHour > 0
      ? Math.max(0, capacity - available) / ratePerHour * 3600
      : 0;
    return { available, capacity, fill, fullInSeconds };
  }, [extraction, now]);"""
          text, count = panel_live_pattern.subn(panel_live_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Territory live extraction block not found')

          action_tail = """        ) : null}
      </View>

      {scanCapabilities ? ("""
          action_tail_replacement = """        ) : null}
      </View>

      {!rival && (Boolean(selectedCell.building) || ownedByPlayer || depositsInSelectedCell.length > 0) ? (
        <View style={styles.actionArea}>
          <ActionButton
            label={scanning ? `РАЗВЕДКА · ${formatClock(scanElapsed)}` : 'ГЕОРАЗВЕДКА'}
            disabled={scanning || action !== null}
            busy={scanning}
            tone=\"cyan\"
            onPress={onScan}
          />
        </View>
      ) : null}

      {scanCapabilities ? ("""
          if action_tail not in text:
              raise SystemExit('Territory action tail not found')
          text = text.replace(action_tail, action_tail_replacement, 1)
          panel.write_text(text)
          PY

      - name: Remove helper workflow and commit hotfix
        run: |
          rm .github/workflows/apply-mobile-hotfix-v0210.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mobile): restore exploration and scale map objects"
          git push origin HEAD:fix/mobile-exploration-map-scale

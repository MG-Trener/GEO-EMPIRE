name: Apply First Mining Loop Fix

on:
  push:
    branches:
      - feature/first-mining-loop-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/first-mining-loop-v1
          fetch-depth: 0
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/mobile/AppFirstMiningLoop.tsx')
          text = app.read_text()
          old = 'const merged = new Map<string, ScanDeposit>();'
          new = 'const merged = new globalThis.Map<string, ScanDeposit>();'
          if old not in text:
              raise SystemExit('AppFirstMiningLoop Map target not found')
          app.write_text(text.replace(old, new, 1))

          summary = Path('apps/mobile/src/StrategicCellSummary.tsx')
          text = summary.read_text()
          replacements = {
              '  onCollect: () => void;': '  onCollect?: () => void;',
              '  onStartExtraction: (depositId: string) => void;': '  onStartExtraction?: (depositId: string) => void;',
              '      onPress: onCollect,': '      onPress: onCollect ?? onExpand,',
              '      onPress: () => onStartExtraction(primaryDeposit.id),': '      onPress: () => onStartExtraction?.(primaryDeposit.id),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'StrategicCellSummary target not found: {old}')
              text = text.replace(old, new, 1)
          summary.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/AppFirstMiningLoop.tsx apps/mobile/src/StrategicCellSummary.tsx
          git commit -m "fix(mobile): resolve first mining loop typecheck"
          git push origin HEAD:feature/first-mining-loop-v1

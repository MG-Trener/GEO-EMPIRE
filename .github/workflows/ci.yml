name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Typecheck API and mobile
        run: npm run typecheck

      - name: Build API
        run: npm run build:api

      - name: Build API Docker image
        run: docker build -f Dockerfile -t geo-empire-api:ci apps/api

name: Organize GEO EMPIRE Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-organize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Resize, optimize and organize images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path('apps/mobile/assets/images')

          mapping = {
              '0c5b0ee0-a621-46fb-bffb-10715d1ff9c3.png': ('resources/copper-ore.png', 'resource'),
              '32fe2442-a256-45dc-bad4-6a26e51844a2.png': ('references/ui-system-board.jpg', 'reference'),
              '3a1a7d46-a78e-4b67-94b8-7ccfcdf2aec9.png': ('equipment/open-pit-mining-truck.png', 'equipment'),
              '50caccef-04b8-45b3-82c2-c59b88b08b89.png': ('resources/natural-gas.png', 'resource'),
              '6333f9b4-8411-4a52-a366-c78809de1829.png': ('references/gameplay-ui-board.jpg', 'reference'),
              '6eb6471f-6dd2-4e95-836e-d9b0f7372cd3.png': ('splash/geo-empire-promo.jpg', 'splash'),
              '78abfadb-498a-4a9c-9961-6de18e118614.png': ('resources/iron-ore.png', 'resource'),
              '8701d8fb-f9a7-4919-a5a6-bc68a4591def.png': ('buildings/oil-pumpjack.png', 'equipment'),
              '87ebd044-3c12-42b5-9b75-8f4cec63658c.png': ('splash/geo-empire-start.jpg', 'splash'),
              '999619a0-1bed-4cd7-ae60-12579a76a2f1.png': ('resources/coal.png', 'resource'),
              'ee484932-59e3-499e-9532-0e43dcc49849.png': ('resources/gold-ore.png', 'resource'),
              'f7165994-9b77-4c88-9d4e-ca6a39ec738e.png': ('resources/oil.png', 'resource'),
          }

          for src_name, (dst_rel, kind) in mapping.items():
              src = root / src_name
              if not src.exists():
                  print(f'SKIP missing {src}')
                  continue
              dst = root / dst_rel
              dst.parent.mkdir(parents=True, exist_ok=True)

              with Image.open(src) as im:
                  if kind == 'resource':
                      rgba = im.convert('RGBA')
                      out = rgba.resize((512, 512), Image.Resampling.LANCZOS)
                      out.save(dst, format='PNG', optimize=True, compress_level=9)
                  elif kind == 'equipment':
                      rgba = im.convert('RGBA')
                      out = rgba.resize((768, 768), Image.Resampling.LANCZOS)
                      out.save(dst, format='PNG', optimize=True, compress_level=9)
                  elif kind == 'splash':
                      rgb = im.convert('RGB')
                      out = ImageOps.fit(rgb, (900, 1600), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                      out.save(dst, format='JPEG', quality=90, optimize=True, progressive=True)
                  elif kind == 'reference':
                      rgb = im.convert('RGB')
                      rgb.thumbnail((1280, 1280), Image.Resampling.LANCZOS)
                      rgb.save(dst, format='JPEG', quality=90, optimize=True, progressive=True)

              src.unlink()
              print(f'{src_name} -> {dst_rel}')

          # Remove placeholders where real assets now exist.
          for rel in ['resources/.gitkeep', 'buildings/.gitkeep', 'splash/.gitkeep']:
              p = root / rel
              if p.exists():
                  p.unlink()
          PY

      - name: Commit organized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/images
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "assets: optimize and organize GEO EMPIRE artwork"
          git push origin main
